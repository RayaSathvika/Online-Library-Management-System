<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Registration — Library Management</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Online Library Management</h1>
    <nav id="main-nav" class="nav"></nav>
  </header>
  <main class="container">
    <div class="card">
      <h2>Student Registration</h2>
      <p class="subtitle">Register a new student to issue books.</p>
      <form id="student-form">
        <div class="form-grid">
          <div class="full">
            <label for="name">Full name</label>
            <input id="name" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" type="email" required />
          </div>
          <div>
            <label for="phone">Phone</label>
            <input id="phone" required />
          </div>
        </div>
        <div class="actions">
          <button type="submit">Register Student</button>
        </div>
      </form>
      <div id="msg" class="msg"></div>
    </div>

    <div class="card">
      <h2>Registered Students</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
            </tr>
          </thead>
          <tbody id="students-body"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("students");
    const msg = document.getElementById("msg");

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadStudents() {
      const data = await api("/api/students");
      const tbody = document.getElementById("students-body");
      if (!data.success || !data.students.length) {
        tbody.innerHTML = `<tr><td colspan="4">No students registered yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = data.students
        .map(
          (s) => `<tr>
            <td>${s.student_id}</td>
            <td>${escapeHtml(s.name)}</td>
            <td>${escapeHtml(s.email)}</td>
            <td>${escapeHtml(s.phone)}</td>
          </tr>`
        )
        .join("");
    }

    document.getElementById("student-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
      };
      const data = await api("/api/students", {
        method: "POST",
        body: JSON.stringify(payload),
      });
      showMsg(msg, data.message, data.success ? "ok" : "err");
      if (data.success) {
        e.target.reset();
        loadStudents();
      }
    });

    loadStudents();
  </script>
</body>
</html>
